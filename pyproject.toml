[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-prefetch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "qwen38next-local",
  "mlx==0.32.2",
  "numpy>=1.26",
  "safetensors>=0.4",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "transformers==5.16.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
